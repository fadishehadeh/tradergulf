<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09112a"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Rising bars (large, right side) -->
  <rect x="680" y="390" width="60" height="180" rx="8" fill="#34d399" opacity="0.2"/>
  <rect x="760" y="310" width="60" height="260" rx="8" fill="#34d399" opacity="0.35"/>
  <rect x="840" y="220" width="60" height="350" rx="8" fill="#34d399" opacity="0.5"/>
  <rect x="920" y="130" width="60" height="440" rx="8" fill="#34d399" opacity="0.7"/>
  <rect x="1000" y="50"  width="60" height="520" rx="8" fill="#34d399" opacity="0.9"/>
  <rect x="1080" y="20"  width="60" height="550" rx="8" fill="#34d399"/>

  <!-- Trend line -->
  <polyline points="710,390 790,310 870,220 950,130 1030,50 1110,20"
            fill="none" stroke="white" stroke-width="3" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Logo icon (left) -->
  <rect x="80" y="195" width="64" height="64" rx="14" fill="#09112a" stroke="#34d399" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="87"  y="238" width="11" height="14" rx="2" fill="#34d399" opacity="0.4"/>
  <rect x="102" y="230" width="11" height="22" rx="2" fill="#34d399" opacity="0.65"/>
  <rect x="117" y="221" width="11" height="31" rx="2" fill="#34d399" opacity="0.85"/>
  <rect x="132" y="212" width="11" height="40" rx="2" fill="#34d399"/>

  <!-- TRADER text -->
  <text x="80" y="300" font-family="'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="80" fill="white" letter-spacing="6">TRADER</text>
  <!-- GULF text -->
  <text x="80" y="385" font-family="'Segoe UI',system-ui,sans-serif" font-weight="900" font-size="80" fill="#34d399" letter-spacing="6">GULF</text>

  <!-- Tagline -->
  <text x="80" y="430" font-family="'Segoe UI',system-ui,sans-serif" font-weight="400" font-size="24" fill="white" opacity="0.4" letter-spacing="3">INDEPENDENT FOREX BROKER REVIEWS</text>

  <!-- Bottom accent line -->
  <rect x="80" y="460" width="200" height="3" rx="1.5" fill="#34d399" opacity="0.6"/>
</svg>
